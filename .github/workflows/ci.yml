name: CI

on:
  push:
    branches: ["master", "claude/**"]
  pull_request:
    branches: ["master"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Askaiser.Marionette.slnx -c Release

      - name: Unit tests
        run: dotnet test --solution Askaiser.Marionette.slnx -c Release --no-build

      # Desktop tests drive the real screen, mouse and keyboard of the runner: they are what verifies each platform backend.
      - name: Desktop tests (Linux, in a virtual X server)
        if: runner.os == 'Linux'
        env:
          MARIONETTE_DESKTOP_TESTS: "1"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libx11-6 libxtst6 libxext6 libxrandr2
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" dotnet test --project tests/Askaiser.Marionette.Tests -c Release --no-build --treenode-filter "/*/*/DesktopTests/*"

      - name: Desktop tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MARIONETTE_DESKTOP_TESTS: "1"
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          dotnet test --project tests/Askaiser.Marionette.Tests -c Release --no-build --treenode-filter "/*/*/DesktopTests/*"

      - name: Desktop tests (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        env:
          MARIONETTE_DESKTOP_TESTS: "1"
        run: |
          dotnet test --project tests/Askaiser.Marionette.Tests -c Release --no-build --treenode-filter "/*/*/DesktopTests/*" --timeout 6m --output Detailed &
          tests=$!

          # Tests that hang are described, then killed along with the browser they started: this step would not end while they run.
          (
            sleep 300 > /dev/null 2>&1 < /dev/null
            echo "::error::The desktop tests did not complete in 5 minutes."
            mkdir -p TestResults/hang
            screencapture -x TestResults/hang/screen.png || true
            ps -axo pid,ppid,etime,%cpu,rss,command > TestResults/hang/processes.txt || true
            dotnet tool install --tool-path TestResults/hang/tools dotnet-stack > /dev/null 2>&1 || true
            for pid in $(pgrep -f "Askaiser.Marionette.Tests"); do
              if ps -p "$pid" -o command= | grep -q -e "Chrome" -e "Edge" -e "Chromium"; then continue; fi
              sample "$pid" 2 -file "TestResults/hang/native-stacks-$pid.txt" > /dev/null 2>&1 || true
              TestResults/hang/tools/dotnet-stack report --process-id "$pid" > "TestResults/hang/managed-stacks-$pid.txt" 2>&1 &
              stacks=$!
              (sleep 30 > /dev/null 2>&1 < /dev/null; kill -9 "$stacks" 2> /dev/null) &
              wait "$stacks" || true
            done
            rm -rf TestResults/hang/tools
            pkill -9 -f "marionette-tests-" || true
            pkill -9 -f "Askaiser.Marionette.Tests" || true
          ) &
          watchdog=$!

          status=0
          wait "$tests" || status=$?
          kill "$watchdog" 2> /dev/null || true
          exit "$status"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            TestResults/
            tests/**/bin/Release/**/desktop-failures/
            tests/**/bin/Release/**/desktop-videos/
